name: Update public report

on:
  schedule:
    # GitHub may delay or drop individual schedule events. Six off-peak
    # attempts improve delivery; a dependency-free preflight keeps the full
    # collector hourly by skipping runs until a source is actually due.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: solana-report-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      LIVE_REFRESH_MINUTES: ${{ vars.LIVE_REFRESH_MINUTES || '60' }}
      DAILY_REFRESH_HOURS: ${{ vars.DAILY_REFRESH_HOURS || '6' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Check whether collection is due
        id: due
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-update-due.js
      - if: steps.due.outputs.due == 'true'
        run: npm ci
      - name: Collect, calculate, and generate outputs
        if: steps.due.outputs.due == 'true'
        run: npm run update
      - name: Verify generated artifacts
        if: steps.due.outputs.due == 'true'
        run: npm run ci
      - name: Commit changed data
        if: steps.due.outputs.due == 'true'
        shell: bash
        run: |
          if git diff --quiet -- public/data.json public/report.md; then
            echo "No generated changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data.json public/report.md
          git commit -m "chore(data): refresh Solana report [skip ci]"
          git push
