name: Check deployed data freshness

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deployed-data-freshness
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      PUBLIC_DATA_URL: ${{ vars.PUBLIC_DATA_URL || 'https://deskyrin-gamma.vercel.app/data.json' }}
      MAX_DATA_AGE_MINUTES: ${{ vars.MAX_DATA_AGE_MINUTES || '180' }}
      EXPECTED_SCHEMA_VERSION: ${{ vars.EXPECTED_SCHEMA_VERSION }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npm run check:freshness
